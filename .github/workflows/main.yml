name: Build Pervent Client

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: ''

      - name: Install dependencies
        shell: pwsh
        run: npm.cmd install

      - name: Rebuild native Electron modules
        shell: pwsh
        run: npx.cmd electron-builder install-app-deps

      - name: Build Windows installer
        shell: pwsh
        run: npx.cmd electron-builder --win --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: Pervent-Client-Windows
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 14
